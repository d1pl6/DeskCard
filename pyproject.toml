[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.config", "src.ui", "src.ui.helpers"]

[tool.setuptools.dynamic]
version = {attr = "src._version.__version__"}

[project]
name = "DeskCard"
dynamic = ["version"]
description = "Flashcard app that overlays on top of your screen until you finish the exercise"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "d1pl" },
]
keywords = ["anki", "flashcard"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/d1pl6/DeskCard"
Repository = "https://github.com/d1pl6/DeskCard"

[project.optional-dependencies]
audio = ["pygame-ce"]
images = ["pillow"]
all = [
    "pygame-ce",
    "pillow"
]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
deskcard = "src.ui.loader:main"